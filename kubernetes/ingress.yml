apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cashly-ingress
  labels:
    app.kubernetes.io/name: cashly-ingress
spec:
  ingressClassName: caddy
  rules:
  - host: localhost
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: cashly-service
            port: 
              number: 3000
