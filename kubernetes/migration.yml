apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      containers:
      - name: cashly
        image: localhost/cashly:latest
        imagePullPolicy: IfNotPresent
        command: ["pnpm", "run", "db:migrate"]
      restartPolicy: Never
