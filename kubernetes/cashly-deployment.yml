apiVersion: apps/v1
kind: Deployment
metadata:
  name: cashly-deployment
spec:
  selector:
    matchLabels:
      app: cashly
  template:
    metadata:
      labels:
        app: cashly
    spec:
      containers:
      - name: cashly
        image: cashly:latest
        resources:
          limits:
            memory: "768Mi"
            cpu: "1"
          requests:
            memory: "768Mi"
            cpu: "1"
        envFrom:
          - configMapRef:
              name: cashly-config
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: cashly-secret
                key: PGPASSWORD
          - name: PGUSER
            value: postgres            
          - name: PGDATABASE
            value: cashly
          - name: PGSSLMODE
            value: disable
          - name: PGCHANNELBINDING
            value: disable

        ports:
        - containerPort: 3000
